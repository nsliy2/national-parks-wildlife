<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page title goes here</title>

  <!-- Vega, Vega-Lite and Vega-Embed (the three libraries from the week 7 studio) -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <!-- Pure.css grid (week 9 studio) -->
  <link rel="stylesheet" href="https://unpkg.com/purecss@2.0.3/build/pure-min.css">

  <!-- Your own styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="page">

  <!-- Row 1: title + intro (full width) -->
  <div class="pure-g">
    <div class="pure-u-1-1">
      <h1></h1>
      <p></p>
    </div>
  </div>

  <!-- Row 2: wide map | text -->
  <div class="pure-g">
    <div class="pure-u-2-3">
      <div id="map1" class="vis-container"></div>
    </div>
    <div class="pure-u-1-3">
      <div class="description description-right"><h2></h2><p></p></div>
    </div>
  </div>

  <!-- Row 3: text | wide map -->
  <div class="pure-g">
    <div class="pure-u-1-3">
      <div class="description description-left"><h2></h2><p></p></div>
    </div>
    <div class="pure-u-2-3">
      <div id="map2" class="vis-container"></div>
    </div>
  </div>

  <!-- Row 4: text | chart | chart (thirds) -->
  <div class="pure-g">
    <div class="pure-u-1-3">
      <div class="description description-left"><h2></h2><p></p></div>
    </div>
    <div class="pure-u-1-3">
      <div id="waffle" class="vis-container"></div>
    </div>
    <div class="pure-u-1-3">
      <div id="heatmap" class="vis-container"></div>
    </div>
  </div>

  <!-- Row 5: wide map | text -->
  <div class="pure-g">
    <div class="pure-u-2-3">
      <div id="binmap" class="vis-container"></div>
    </div>
    <div class="pure-u-1-3">
      <div class="description description-right"><h2></h2><p></p></div>
    </div>
  </div>

  <!-- Row 6: halves -->
  <div class="pure-g">
    <div class="pure-u-1-2">
      <div id="lollipop" class="vis-container"></div>
    </div>
    <div class="pure-u-1-2">
      <div id="jitter" class="vis-container"></div>
    </div>
  </div>

  <!-- Row 7: footnote + data sources -->
  <div class="pure-g">
    <div class="pure-u-1-1 small-font">
      <p></p>
    </div>
  </div>

</div>
  <script src="js/main.js"></script>
</body>

</html>
